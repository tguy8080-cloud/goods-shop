<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 및 회원가입 | Goods Shop</title><link rel="stylesheet" href="assets/css/style.css?v=20261018-1">
  <script src="assets/js/config.js" defer></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.89.0" defer></script><script src="assets/js/client.js?v=20261017-6" defer></script><script src="assets/js/auth.js" defer></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html">goods shop<span>.</span></a><nav class="site-nav" aria-label="주요 메뉴"><a href="index.html" data-page="index.html">상품</a><a id="orders-nav-link" href="my-orders.html" data-page="my-orders.html" hidden>내 주문</a><a id="admin-nav-link" href="admin.html" data-page="admin.html" hidden>관리자</a><a id="user-greeting" class="user-greeting" href="account.html" aria-live="polite" hidden></a><a id="account-link" class="nav-cta" href="auth.html">로그인</a></nav></header>
  <main class="container narrow">
    <section class="page-intro"><p class="eyebrow">ACCOUNT</p><h1>계정 만들기</h1><p class="muted">Supabase Auth로 계정을 안전하게 관리합니다.</p></section>
    <p id="auth-status" class="notice" role="status" aria-live="polite" hidden></p>
    <div class="auth-grid">
      <section class="panel"><h2>회원가입</h2><form id="signup-form" class="form-stack">
        <label>이름<input name="display_name" type="text" autocomplete="name" maxlength="80" required></label>
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" required><small>8자 이상 입력해 주세요.</small></label>
        <button class="button button-dark" type="submit">회원가입</button>
      </form></section>
      <section class="panel"><h2>로그인</h2><form id="login-form" class="form-stack">
        <label>이메일<input name="email" type="email" autocomplete="email" required></label>
        <label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button button-light" type="submit">로그인</button>
      </form></section>
    </div>
    <p class="fine-print">계정이 만들어지지 않으면 Supabase Dashboard에서 이메일 확인 설정을 확인해 주세요. 테스트 계정 비밀번호를 다른 곳에 재사용하지 마세요.</p>
  </main>
  <footer class="site-footer"><span>goods shop</span><span>계정 보안은 Supabase Auth가 담당합니다.</span></footer>
</body>
</html>
